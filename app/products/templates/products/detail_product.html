{% extends 'base.html' %}

{% block content %}
<div class="card p-4 shadow-sm">
    <h2>{{ product.name }}</h2>
    <h4 class="text-success">${{ product.price }}</h4>
    <hr>
    <p class="fs-5">{{ product.content }}</p>
    <a href="{{ url_for('products.list_products') }}" class="btn btn-secondary mt-3">← Назад до каталогу</a>
</div>
{% endblock %}
