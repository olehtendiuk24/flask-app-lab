{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card p-4 shadow-sm border-danger">
        <h2 class="text-danger">Підтвердження видалення</h2>
        <p class="fs-5">Ви дійсно хочете видалити пост <strong>"{{ post.title }}"</strong>?</p>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-danger">Так, видалити</button>
            <a href="{{ url_for('posts.detail_post', id=post.id) }}" class="btn btn-secondary">Скасувати</a>
        </form>
    </div>
</div>
{% endblock %}
